openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sanjay Medical Pharmacy Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: medicines
    description: Medicine inventory
  - name: categories
    description: Medicine categories
  - name: suppliers
    description: Supplier management
  - name: purchases
    description: Purchase management
  - name: sales
    description: Sales and billing
  - name: customers
    description: Customer management
  - name: dashboard
    description: Dashboard analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  # ─── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/sales-chart:
    get:
      operationId: getSalesChart
      tags: [dashboard]
      summary: Get daily sales chart data (last 30 days)
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesChartPoint"

  /dashboard/top-medicines:
    get:
      operationId: getTopMedicines
      tags: [dashboard]
      summary: Get top selling medicines
      responses:
        "200":
          description: Top medicines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopMedicine"

  /dashboard/expiry-alerts:
    get:
      operationId: getExpiryAlerts
      tags: [dashboard]
      summary: Get medicines expiring soon (grouped by 30/60/90 days)
      responses:
        "200":
          description: Expiry alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiryAlerts"

  /dashboard/low-stock:
    get:
      operationId: getLowStockAlerts
      tags: [dashboard]
      summary: Get low stock medicines
      responses:
        "200":
          description: Low stock medicines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LowStockMedicine"

  # ─── CATEGORIES ─────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── MEDICINES ───────────────────────────────────────────────────────────────
  /medicines:
    get:
      operationId: listMedicines
      tags: [medicines]
      summary: List medicines
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: expiryDays
          in: query
          schema:
            type: integer
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of medicines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medicine"
    post:
      operationId: createMedicine
      tags: [medicines]
      summary: Create medicine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"

  /medicines/{id}:
    get:
      operationId: getMedicine
      tags: [medicines]
      summary: Get medicine by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Medicine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
    patch:
      operationId: updateMedicine
      tags: [medicines]
      summary: Update medicine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
    delete:
      operationId: deleteMedicine
      tags: [medicines]
      summary: Delete medicine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── SUPPLIERS ───────────────────────────────────────────────────────────────
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── PURCHASES ───────────────────────────────────────────────────────────────
  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      summary: List purchases
      responses:
        "200":
          description: List of purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Create purchase (auto-increments stock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"

  /purchases/{id}:
    get:
      operationId: getPurchase
      tags: [purchases]
      summary: Get purchase with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"

  # ─── SALES ───────────────────────────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale (billing/POS - auto-decrements stock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get sale with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  # ─── CUSTOMERS ───────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}/payment:
    post:
      operationId: recordCustomerPayment
      tags: [customers]
      summary: Record credit payment from customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── AUTH ──────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, name, role]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, cashier, inventory_manager]

    # ── DASHBOARD ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [todaySales, weeklySales, monthlySales, totalMedicines, lowStockCount, expiringCount, expiredCount, inventoryValue, todayProfit]
      properties:
        todaySales:
          type: number
        weeklySales:
          type: number
        monthlySales:
          type: number
        todayProfit:
          type: number
        totalMedicines:
          type: integer
        lowStockCount:
          type: integer
        expiringCount:
          type: integer
        expiredCount:
          type: integer
        inventoryValue:
          type: number

    SalesChartPoint:
      type: object
      required: [date, sales, profit]
      properties:
        date:
          type: string
        sales:
          type: number
        profit:
          type: number

    TopMedicine:
      type: object
      required: [id, name, quantitySold, revenue]
      properties:
        id:
          type: integer
        name:
          type: string
        quantitySold:
          type: integer
        revenue:
          type: number

    ExpiryAlerts:
      type: object
      required: [within30, within60, within90, expired]
      properties:
        within30:
          type: array
          items:
            $ref: "#/components/schemas/ExpiryMedicine"
        within60:
          type: array
          items:
            $ref: "#/components/schemas/ExpiryMedicine"
        within90:
          type: array
          items:
            $ref: "#/components/schemas/ExpiryMedicine"
        expired:
          type: array
          items:
            $ref: "#/components/schemas/ExpiryMedicine"

    ExpiryMedicine:
      type: object
      required: [id, name, batchNumber, expiryDate, quantity, daysUntilExpiry]
      properties:
        id:
          type: integer
        name:
          type: string
        batchNumber:
          type: string
        expiryDate:
          type: string
        quantity:
          type: integer
        daysUntilExpiry:
          type: integer

    LowStockMedicine:
      type: object
      required: [id, name, quantity, reorderLevel]
      properties:
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        reorderLevel:
          type: integer

    # ── CATEGORY ──────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    # ── MEDICINE ──────────────────────────────────────────────────────────────
    Medicine:
      type: object
      required: [id, name, genericName, quantity, purchasePrice, sellingPrice, expiryDate, batchNumber, reorderLevel, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        genericName:
          type: string
        brandName:
          type: ["string", "null"]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        batchNumber:
          type: string
        barcode:
          type: ["string", "null"]
        expiryDate:
          type: string
        quantity:
          type: integer
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        vatPercent:
          type: number
        supplierId:
          type: ["integer", "null"]
        supplierName:
          type: ["string", "null"]
        storageLocation:
          type: ["string", "null"]
        reorderLevel:
          type: integer
        expiryStatus:
          type: string
          enum: [valid, expiring_soon, expired]
        createdAt:
          type: string

    MedicineInput:
      type: object
      required: [name, genericName, batchNumber, expiryDate, quantity, purchasePrice, sellingPrice]
      properties:
        name:
          type: string
        genericName:
          type: string
        brandName:
          type: string
        categoryId:
          type: integer
        batchNumber:
          type: string
        barcode:
          type: string
        expiryDate:
          type: string
        quantity:
          type: integer
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        vatPercent:
          type: number
        supplierId:
          type: integer
        storageLocation:
          type: string
        reorderLevel:
          type: integer

    MedicineUpdate:
      type: object
      properties:
        name:
          type: string
        genericName:
          type: string
        brandName:
          type: string
        categoryId:
          type: integer
        batchNumber:
          type: string
        barcode:
          type: string
        expiryDate:
          type: string
        quantity:
          type: integer
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        vatPercent:
          type: number
        supplierId:
          type: integer
        storageLocation:
          type: string
        reorderLevel:
          type: integer

    # ── SUPPLIER ──────────────────────────────────────────────────────────────
    Supplier:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        totalPurchases:
          type: number

    SupplierInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string

    # ── PURCHASE ──────────────────────────────────────────────────────────────
    Purchase:
      type: object
      required: [id, supplierId, supplierName, invoiceNumber, purchaseDate, totalAmount, items, createdAt]
      properties:
        id:
          type: integer
        supplierId:
          type: integer
        supplierName:
          type: string
        invoiceNumber:
          type: string
        purchaseDate:
          type: string
        totalAmount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItem"
        createdAt:
          type: string

    PurchaseItem:
      type: object
      required: [id, medicineId, medicineName, quantity, purchasePrice, batchNumber, expiryDate]
      properties:
        id:
          type: integer
        medicineId:
          type: integer
        medicineName:
          type: string
        quantity:
          type: integer
        purchasePrice:
          type: number
        batchNumber:
          type: string
        expiryDate:
          type: string

    PurchaseInput:
      type: object
      required: [supplierId, invoiceNumber, purchaseDate, items]
      properties:
        supplierId:
          type: integer
        invoiceNumber:
          type: string
        purchaseDate:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseItemInput"

    PurchaseItemInput:
      type: object
      required: [medicineId, quantity, purchasePrice, batchNumber, expiryDate]
      properties:
        medicineId:
          type: integer
        quantity:
          type: integer
        purchasePrice:
          type: number
        batchNumber:
          type: string
        expiryDate:
          type: string

    # ── SALE ──────────────────────────────────────────────────────────────────
    Sale:
      type: object
      required: [id, billNumber, saleDate, subtotal, discountAmount, vatAmount, totalAmount, items, createdAt]
      properties:
        id:
          type: integer
        billNumber:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        saleDate:
          type: string
        subtotal:
          type: number
        discountAmount:
          type: number
        vatAmount:
          type: number
        totalAmount:
          type: number
        paidAmount:
          type: number
        isCredit:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        createdAt:
          type: string

    SaleItem:
      type: object
      required: [id, medicineId, medicineName, quantity, unitPrice, discount, vatPercent, total]
      properties:
        id:
          type: integer
        medicineId:
          type: integer
        medicineName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        discount:
          type: number
        vatPercent:
          type: number
        total:
          type: number

    SaleInput:
      type: object
      required: [items]
      properties:
        customerId:
          type: integer
        customerName:
          type: string
        customerPhone:
          type: string
        discountAmount:
          type: number
        paidAmount:
          type: number
        isCredit:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItemInput"

    SaleItemInput:
      type: object
      required: [medicineId, quantity, unitPrice]
      properties:
        medicineId:
          type: integer
        quantity:
          type: integer
        unitPrice:
          type: number
        discount:
          type: number
        vatPercent:
          type: number

    # ── CUSTOMER ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, name, creditBalance, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        creditBalance:
          type: number
        totalPurchases:
          type: number
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string

    PaymentInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
        note:
          type: string
